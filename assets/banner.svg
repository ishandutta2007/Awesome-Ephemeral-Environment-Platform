<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Decorative Glowing Orbs -->
  <circle cx="150" cy="80" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="280" r="200" fill="#ec4899" opacity="0.1" filter="url(#glow)"/>
  <circle cx="900" cy="70" r="140" fill="#06b6d4" opacity="0.1" filter="url(#glow)"/>

  <!-- Animated Node Connection Network / Circuit lines -->
  <g stroke="url(#cyan-grad)" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <!-- Ephemeral Pod/Container Nodes -->
    <path d="M 100 280 L 220 220 L 380 260 M 220 220 L 220 120 L 360 80" stroke-dasharray="4,4"/>
    <path d="M 820 100 L 960 160 L 1100 110 M 960 160 L 960 270 L 1080 300" stroke-dasharray="4,4"/>
    <path d="M 500 320 L 600 280 L 700 320"/>
  </g>

  <!-- Floating Tech Badges / Nodes -->
  <g opacity="0.7">
    <!-- Pod 1 -->
    <rect x="180" y="100" width="80" height="40" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="220" y="125" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PR #1042</text>
    <circle cx="195" cy="120" r="4" fill="#22c55e"/>

    <!-- Pod 2 -->
    <rect x="920" y="140" width="90" height="40" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="965" y="165" fill="#f472b6" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">vCluster-01</text>
    <circle cx="935" cy="160" r="4" fill="#3b82f6"/>

    <!-- Pod 3 -->
    <rect x="70" y="260" width="85" height="35" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="112" y="282" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">preview-env</text>
  </g>

  <!-- Central Header Panel -->
  <g transform="translate(600, 165)">
    <!-- Subtitle Badge -->
    <rect x="-180" y="-105" width="360" height="32" rx="16" fill="#1e293b" stroke="url(#primary-grad)" stroke-width="1.5" opacity="0.9" />
    <text x="0" y="-84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">
      ⚡ CLOUD-NATIVE &amp; KUBERNETES ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="0" y="-20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
      <tspan fill="#ffffff">Awesome Ephemeral</tspan>
    </text>
    <text x="0" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
      <tspan fill="url(#primary-grad)" filter="url(#soft-glow)">Environment Platform</tspan>
    </text>

    <!-- Subtitle Tagline -->
    <text x="0" y="80" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="0.5">
      Curated Guide to On-Demand Dev Environments, Preview Stacks &amp; GitOps Infrastructure
    </text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#primary-grad)" />
</svg>
